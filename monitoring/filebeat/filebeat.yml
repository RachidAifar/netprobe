filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            contains:
              docker.container.image: netprobe
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              # NetProbe already logs JSON, so parse it into fields.
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "netprobe-%{+yyyy.MM.dd}"

setup.template.name: netprobe
setup.template.pattern: "netprobe-*"
setup.ilm.enabled: false
