apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netprobe
resources:
  - ../../base
  - hpa.yaml
components:
  - ../../components/monitoring
images:
  - name: netprobe
    newName: ghcr.io/rachidaifar/netprobe
    newTag: latest
patches:
  - target:
      kind: Deployment
      name: netprobe
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            memory: 192Mi
