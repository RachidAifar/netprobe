apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netprobe
resources:
  - ../../base
components:
  - ../../components/monitoring
replicas:
  - name: netprobe
    count: 1
# CI updates this tag after every successful build on main (GitOps).
images:
  - name: netprobe
    newName: ghcr.io/rachidaifar/netprobe
    newTag: latest
