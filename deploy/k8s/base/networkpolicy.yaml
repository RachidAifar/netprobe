# Only Prometheus (monitoring namespace) and pods in this namespace may call NetProbe.
# Egress stays open because probing outside targets is the job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netprobe
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: netprobe
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector: {}
      ports:
        - port: 8080
