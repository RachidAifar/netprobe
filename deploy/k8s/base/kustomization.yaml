apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netprobe
labels:
  - pairs:
      app.kubernetes.io/name: netprobe
      app.kubernetes.io/part-of: netprobe
    includeSelectors: true
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: netprobe-targets
    files:
      - targets.yaml
images:
  - name: netprobe
    newName: ghcr.io/rachidaifar/netprobe
    newTag: latest
