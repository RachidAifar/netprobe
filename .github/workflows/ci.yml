name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/netprobe
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=netprobe --cov-report=term-missing --cov-fail-under=85

  validate:
    name: Validate infrastructure code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install linters
        run: pip install yamllint==1.38.0 ansible-core==2.21.5 ansible-lint==26.10.1
      - name: YAML lint
        run: yamllint -s .
      - name: Ansible lint
        run: ansible-lint infra/ansible
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Validate Kubernetes manifests
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default -schema-location "$CRD_SCHEMAS"
            echo "::endgroup::"
          done
          kubeconform -strict -summary -schema-location "$CRD_SCHEMAS" deploy/argocd/application.yaml
      - name: Check Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /p/prometheus.yml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
      - name: Terraform fmt and validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  ansible:
    name: Ansible playbook (runs twice to prove idempotence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install ansible-core==2.21.5
      - name: First run installs the tools
        working-directory: infra/ansible
        run: ansible-playbook bootstrap.yml
      - name: Second run must change nothing
        working-directory: infra/ansible
        run: |
          ansible-playbook bootstrap.yml | tee second-run.log
          grep -qE "changed=0 +unreachable=0 +failed=0" second-run.log

  image:
    name: Build, scan and smoke-test the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: netprobe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name netprobe -p 8080:8080 netprobe:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/metrics | grep netprobe_rounds_total
          test "$(docker inspect -f '{{.Config.User}}' netprobe)" = "10001"
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: netprobe:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: Deploy to a kind cluster
    runs-on: ubuntu-latest
    needs: [test, validate]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: netprobe
          node_image: kindest/node:v1.33.1
      - name: Build and load the image into kind
        run: |
          docker build -t netprobe:e2e .
          kind load docker-image netprobe:e2e --name netprobe
      - name: Install Prometheus Operator CRDs
        run: |
          base=https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.85.0/example/prometheus-operator-crd
          kubectl apply --server-side \
            -f $base/monitoring.coreos.com_servicemonitors.yaml \
            -f $base/monitoring.coreos.com_prometheusrules.yaml
      - name: Deploy the dev overlay with the freshly built image
        run: |
          cd deploy/k8s/overlays/dev
          kustomize edit set image netprobe=netprobe:e2e
          kubectl apply -k .
          kubectl -n netprobe patch deployment netprobe --type json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]'
          kubectl -n netprobe rollout status deployment/netprobe --timeout=120s
      - name: Check the service from inside the cluster
        run: |
          kubectl -n netprobe run curl --rm -i --restart=Never --image=curlimages/curl:8.15.0 -- \
            sh -c 'curl -fs http://netprobe/ready && curl -fs http://netprobe/targets'
      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n netprobe get all
          kubectl -n netprobe describe pods
          kubectl -n netprobe logs deployment/netprobe --tail=100

  publish:
    name: Publish image and update GitOps manifest
    runs-on: ubuntu-latest
    needs: [image, e2e, ansible]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      - name: Point the dev overlay at the new image (Argo CD picks this up)
        run: |
          cd deploy/k8s/overlays/dev
          kustomize edit set image netprobe=${IMAGE,,}:${GITHUB_SHA}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: netprobe ${GITHUB_SHA::7} [skip ci]"
          git push
